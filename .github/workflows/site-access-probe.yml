name: Temporary public listings access probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-access-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-probe:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-audit --no-fund playwright@1.63.0
      - name: Check robots rules and public listing pages only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const UA = 'Mozilla/5.0 (compatible; MarketplaceWatchApp/1.0; read-only public listing access check)';
          const sources = [
            { name: '3arabyat', url: 'https://3arabyat.com/en', pathPattern: /\\/en\\/car\\/[^/]+\\/?$/i },
            { name: 'MasrPlace', url: 'https://masrplace.com/en/cars', pathPattern: /\\/en\\/cars\\/\\d+\\/?$/i },
          ];

          function allowedByRobots(text, pathname) {
            const groups = [];
            let group = null;
            let hasRules = false;
            for (const raw of text.split(/\\r?\\n/)) {
              const line = raw.split('#', 1)[0].trim();
              if (!line) continue;
              const match = line.match(/^(user-agent|allow|disallow):\\s*(.*)$/i);
              if (!match) continue;
              const key = match[1].toLowerCase();
              const value = match[2].trim();
              if (key === 'user-agent') {
                if (!group || hasRules) {
                  group = { agents: [], rules: [] };
                  groups.push(group);
                  hasRules = false;
                }
                group.agents.push(value.toLowerCase());
              } else if (group) {
                hasRules = true;
                if (value) group.rules.push({ allow: key === 'allow', path: value });
              }
            }
            const product = 'marketplacewatchapp';
            const specific = groups.filter(g => g.agents.some(a => a !== '*' && product.includes(a)));
            const selected = specific.length ? specific : groups.filter(g => g.agents.includes('*'));
            const rules = selected.flatMap(g => g.rules).filter(r => {
              const prefix = r.path.replace(/\\*/g, '');
              return pathname.startsWith(prefix);
            });
            if (!rules.length) return true;
            rules.sort((a, b) => b.path.length - a.path.length || Number(b.allow) - Number(a.allow));
            return rules[0].allow;
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ userAgent: UA, locale: 'en-US', timezoneId: 'Africa/Cairo' });
          await context.route('**/*', route => {
            if (['image', 'media', 'font'].includes(route.request().resourceType())) return route.abort();
            return route.continue();
          });

          for (const source of sources) {
            const origin = new URL(source.url).origin;
            try {
              const robots = await fetch(origin + '/robots.txt', {
                headers: { 'user-agent': UA },
                signal: AbortSignal.timeout(15000),
              });
              console.log(source.name + ' robots_status=' + robots.status);
              if (robots.status !== 200) {
                console.log(source.name + ' listing_request=skipped reason=robots_not_readable');
                continue;
              }
              const robotsText = await robots.text();
              const pathname = new URL(source.url).pathname;
              if (!allowedByRobots(robotsText, pathname)) {
                console.log(source.name + ' listing_request=skipped reason=robots_disallow');
                continue;
              }

              await new Promise(resolve => setTimeout(resolve, 5000));
              const page = await context.newPage();
              try {
                const response = await page.goto(source.url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                const finalUrl = page.url();
                const title = await page.title().catch(() => '');
                const body = await page.locator('body').innerText({ timeout: 8000 }).catch(() => '');
                const status = response?.status() ?? 0;
                const challenge = /captcha|verify you are human|access denied|unusual traffic|request blocked/i.test(body.slice(0, 5000));
                if (status === 403 || status === 429 || challenge) {
                  console.log(source.name + ' page_status=' + status + ' listing_request=stopped reason=' + (challenge ? 'challenge_page' : 'http_' + status));
                  continue;
                }
                if (new URL(finalUrl).origin !== origin) {
                  console.log(source.name + ' page_status=' + status + ' listing_request=stopped reason=external_redirect');
                  continue;
                }
                const hrefs = await page.locator('a[href]').evaluateAll((links, pattern) =>
                  [...new Set(links.map(a => {
                    try { return new URL(a.href).pathname; } catch { return ''; }
                  }).filter(path => new RegExp(pattern, 'i').test(path)))],
                  source.pathPattern.source,
                );
                console.log(source.name + ' page_status=' + status + ' title=' + JSON.stringify(title.slice(0, 100)) + ' listing_links=' + hrefs.length);
              } finally {
                await page.close();
              }
            } catch (error) {
              console.log(source.name + ' listing_request=stopped reason=' + String(error?.message || error).slice(0, 180));
            }
          }

          await browser.close();
          NODE
