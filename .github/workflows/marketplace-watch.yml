name: Marketplace Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/marketplace-watch.yml'
      - 'scripts/dubizzle-flex.mjs'
      - 'scripts/dubizzle-policy.mjs'
      - 'scripts/hatla2ee-policy.mjs'
      - 'tests/dubizzle-policy.test.mjs'
      - 'tests/hatla2ee-policy.test.mjs'
      - 'scripts/hatla2ee-watch.mjs'

permissions:
  contents: read

concurrency:
  group: marketplace-watch
  cancel-in-progress: false

jobs:
  dubizzle:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 350
    env:
      MAX_ITEMS: ${{ vars.MAX_ITEMS || '150' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: '@marketpalacebedo'
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: data/seen-dubizzle.json
          key: dubizzle-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dubizzle-seen-
      - name: Validate Dubizzle safety policy
        run: npm test
      - name: Watch Dubizzle continuously
        shell: bash
        run: |
          cycles=10
          max_failures=3
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            cycles=1
            max_failures=1
          fi
          failures=0
          for cycle in $(seq 1 "$cycles"); do
            echo "=== Dubizzle cycle $cycle/$cycles ==="
            if node scripts/dubizzle-flex.mjs; then
              failures=0
            else
              failures=$((failures + 1))
              echo "Dubizzle cycle $cycle failed (consecutive failures: $failures/$max_failures)"
              if [ "$failures" -ge "$max_failures" ]; then
                echo "Dubizzle reached the failure threshold ($max_failures); failing job"
                exit 1
              fi
            fi
            if [ "$cycle" -lt "$cycles" ]; then sleep 1800; fi
          done
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen-dubizzle.json
          key: dubizzle-seen-${{ github.run_id }}-${{ github.run_attempt }}

  hatla2ee:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 350
    env:
      MAX_ITEMS: ${{ vars.MAX_ITEMS || '150' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: '@marketpalacebedo'
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: data/seen-hatla2ee.json
          key: hatla2ee-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hatla2ee-seen-
      - name: Watch Hatla2ee continuously
        shell: bash
        run: |
          cycles=30
          max_failures=3
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            cycles=1
            max_failures=1
          fi
          failures=0
          for cycle in $(seq 1 "$cycles"); do
            echo "=== Hatla2ee cycle $cycle/$cycles ==="
            if node scripts/hatla2ee-watch.mjs; then
              failures=0
            else
              failures=$((failures + 1))
              echo "Hatla2ee cycle $cycle failed (consecutive failures: $failures/$max_failures)"
              if [ "$failures" -ge "$max_failures" ]; then
                echo "Hatla2ee reached the failure threshold ($max_failures); failing job"
                exit 1
              fi
            fi
            if [ "$cycle" -lt "$cycles" ]; then sleep 600; fi
          done
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen-hatla2ee.json
          key: hatla2ee-seen-${{ github.run_id }}-${{ github.run_attempt }}
