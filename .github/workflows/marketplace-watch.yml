name: Marketplace Watch

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 6
    env:
      MARKETPLACE_URL: ${{ vars.MARKETPLACE_URL }}
      MAX_ITEMS: ${{ vars.MAX_ITEMS || '30' }}
      MIN_PRICE: '0'
      MAX_PRICE: '0'
      INCLUDE_KEYWORDS: ${{ vars.INCLUDE_KEYWORDS }}
      EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: '@marketplacebedo'
      FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore seen listings
        uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: marketplace-seen-${{ github.run_id }}
          restore-keys: |
            marketplace-seen-

      - name: Watch Marketplace
        run: npm run watch:marketplace

      - name: Save seen listings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen.json
          key: marketplace-seen-${{ github.run_id }}
