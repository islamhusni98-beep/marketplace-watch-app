name: Cars under 300k — Hatla2ee and Dubizzle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cars-under-250k.yml'
      - 'scripts/hatla2ee-under-250k.mjs'
      - 'scripts/car-cross-source-dedupe.mjs'
      - 'scripts/open-sites-under-300k.mjs'
  schedule:
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cars-under-250k-watch
  cancel-in-progress: false

jobs:
  hatla2ee:
    name: Hatla2ee alerts to carsunder300k
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: "@carsunder300k"
      MAX_ITEMS: ${{ vars.MAX_ITEMS || '150' }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund playwright@1.63.0
      - name: Restore Hatla2ee deduplication state
        uses: actions/cache/restore@v4
        with:
          path: data/seen-hatla2ee-under-250k.json
          key: cars-under-300k-hatla2ee-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cars-under-300k-hatla2ee-
            cars-under-250k-hatla2ee-
      - name: Restore open-site deduplication state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hatla2ee-current-fingerprints.json
            data/seen-open-sites-under-300k.json
          key: cars-under-300k-open-sites-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cars-under-300k-open-sites-
      - name: Scan Hatla2ee and publish new matching cars
        if: github.event_name != 'push'
        run: node scripts/hatla2ee-under-250k.mjs
      - name: Scan 3arabyat and MasrPlace listings
        if: always() && !cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@carsunder300k"
          PUBLISH_TO_TELEGRAM: ${{ github.event_name == 'schedule' }}
          MAX_OPEN_DETAILS_PER_SOURCE: ${{ vars.MAX_OPEN_DETAILS_PER_SOURCE || '3' }}
        run: node scripts/open-sites-under-300k.mjs
      - name: Save Hatla2ee deduplication state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/seen-hatla2ee-under-250k.json
          key: cars-under-300k-hatla2ee-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save open-site deduplication state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/hatla2ee-current-fingerprints.json
            data/seen-open-sites-under-300k.json
          key: cars-under-300k-open-sites-${{ github.run_id }}-${{ github.run_attempt }}

  dubizzle-paused:
    name: Dubizzle access approval required
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why no automated request is made
        run: |
          echo "::notice title=Dubizzle source paused::Dubizzle's published terms prohibit automated scraping without explicit permission. This job makes no Dubizzle request."
          echo "Activate this source only through an approved API/feed or written permission from Dubizzle."
